kind = "mobile"
previewPath = "/"
title = "Millio"
version = "1.0.0"
id = "artifacts/millio"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 19352

[services.development]
run = "pnpm --filter @workspace/millio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/millio", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/millio", "run", "serve" ]

[services.env]
PORT = "19352"
BASE_PATH = "/"
